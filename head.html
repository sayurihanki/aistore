<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme" content="mcx" />
<meta property="og:title" content="AI Store — Marine Corps Exchange" />
<meta property="og:description" content="Field-ready gear, earned savings, and tax-free shopping for Marines and their families." />
<meta property="og:image" content="/og-issue-ledger-v2.png" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  html {
    background: #eee9dd;
  }

  body {
    transition: opacity 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  html[data-page-state="loading"] body {
    opacity: 0;
    visibility: hidden;
  }

  html[data-page-state="ready"] body {
    opacity: 1;
    visibility: visible;
  }

  @media (prefers-reduced-motion: reduce) {
    body {
      transition: none;
    }
  }
</style>
<script nonce="aem">
  window.hlx = window.hlx || {};
  document.documentElement.dataset.pageState = 'loading';

  window.hlx.pageShellReady = () => {
    if (document.body) {
      document.body.classList.add('appear');
    }

    document.documentElement.dataset.pageState = 'ready';

    if (window.hlx.pageShellTimer) {
      window.clearTimeout(window.hlx.pageShellTimer);
      delete window.hlx.pageShellTimer;
    }
  };

  window.hlx.pageShellTimer = window.setTimeout(() => {
    window.hlx.pageShellReady();
  }, 5000);
</script>
